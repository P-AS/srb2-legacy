app-id: io.github.PAS.srb2-legacy
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: srb2legacy
finish-args:
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --persist=.srb2_21

cleanup:
  - /include
  - /lib/*.so
  - /lib/*.la
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc

modules:
  - name: game-music-emu
    buildsystem: cmake-ninja
    sources:
      - type: archive
        url: https://github.com/libgme/game-music-emu/archive/refs/tags/0.6.5.tar.gz
        sha256: 8531678502451c2cf04248cda45c8b4645e19fcfb63e6a7ec2549641c47bb392
        x-checker-data:
          type: anitya
          project-id: 866
          stable-only: true
          url-template: https://github.com/libgme/game-music-emu/archive/refs/tags/$version.tar.gz

  - name: libopenmpt
    config-opts:
      - --disable-examples
      - --disable-openmpt123
      - --disable-static
      - --disable-tests
      - --without-portaudio
      - --without-portaudiocpp
    sources:
      - type: archive
        url: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-0.8.9+release.autotools.tar.gz
        sha256: d7ce84fd05d686c4bcf66af40eae857afa371442db60eeda3f874bd6cf6fc318
        x-checker-data:
          type: anitya
          project-id: 141468
          stable-only: true
          url-template: https://lib.openmpt.org/files/libopenmpt/src/libopenmpt-$version+release.autotools.tar.gz

  - name: sdl2-mixer
    config-opts:
      - -DSDL2MIXER_MOD=OFF
      - -DSDL2MIXER_MIDI=OFF
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.2/SDL2_mixer-2.8.2.tar.gz
        sha256: 938dff531d00ace2296557a6599abe6f34599e2f34f0a4a08a397e2ccac8b8f7
        x-checker-data:
          type: anitya
          project-id: 389478
          stable-only: true
          url-template: https://github.com/libsdl-org/SDL_mixer/releases/download/release-$version/SDL2_mixer-$version.tar.gz

  - name: srb2legacy
    buildsystem: simple
    build-commands:
      - make distclean
      - export CFLAGS="$CFLAGS -I/app/include/SDL2" && make LINUX64=1 -j $FLATPAK_BUILDER_N_JOBS
      - install -D -m 755 -t $FLATPAK_DEST/bin bin/lsdl2srb2legacy
      - install -D -m 644 srb2.png $FLATPAK_DEST/share/icons/hicolor/256x256/apps/$FLATPAK_ID.png
      - install -D -m 755 srb2legacy.sh $FLATPAK_DEST/bin/srb2legacy
      - install -D -m 644 srb2legacy.desktop $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - sed -i "s/Icon=srb2legacy/Icon=$FLATPAK_ID/" $FLATPAK_DEST/share/applications/$FLATPAK_ID.desktop
      - install -D -m 644 flatpak/$FLATPAK_ID.metainfo.xml $FLATPAK_DEST/share/metainfo/$FLATPAK_ID.metainfo.xml
    sources:
      - type: dir
        path: ../
      - type: script
        commands:
          - export SRB2LEGACYWADDIR=/app/assets
          - lsdl2srb2legacy "$@"
        dest-filename: srb2legacy.sh

  - name: srb2assets
    buildsystem: simple
    build-commands:
      - mkdir --parents $FLATPAK_DEST/assets
      - cp --recursive --target-directory=$FLATPAK_DEST/assets *
    sources:
      - type: git
        url: https://codeberg.org/srb2-preservation/assets.git/
        branch: legacy
        commit: 1af2863f5755481c672b7a3a35ccd2133cc80b89

# vim: ts=2:sw=2:expandtab
